<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats Final Practice Quiz</title>
<meta name="description" content="100 practice multiple-choice questions for the statistics final (Keller 12e, Ch 12–17).">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16202c;--muted:#5c6876;--line:#dde2e8;--accent:#1d4e89;--accent-soft:#e7eef7;--ok:#17803d;--ok-soft:#e5f5ea;--bad:#c0262d;--bad-soft:#fbe9ea;--focus:#f2a33a}
@media (prefers-color-scheme: dark){:root{--bg:#0f1419;--card:#18202a;--ink:#e6ebf1;--muted:#9aa7b5;--line:#2a3542;--accent:#7fb0ef;--accent-soft:#1c2c40;--ok:#4cc27a;--ok-soft:#163222;--bad:#ff7b80;--bad-soft:#3a1a1d}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.45rem;margin:4px 0 2px}
.sub{color:var(--muted);margin:0 0 18px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:.92rem;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
label.chk{display:flex;align-items:center;gap:8px;font-size:.93rem;color:var(--muted);margin-top:10px}
select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.btn{border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.85rem;margin-bottom:8px;flex-wrap:wrap}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.q{font-size:1.05rem;margin:0 0 14px}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 12px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.pill:focus-visible,.btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.opt b{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:.85rem}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok b{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad b{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.why{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:.95rem}
.why strong{display:block;margin-bottom:3px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:8px}
.score{font-size:2.4rem;font-weight:700;margin:0}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
td.n{text-align:right;white-space:nowrap}
.miss{border-top:1px solid var(--line);padding:10px 0;font-size:.93rem}
.miss .a{color:var(--ok);font-weight:600}.miss .y{color:var(--bad)}
.hint{color:var(--muted);font-size:.82rem;margin-top:10px}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>Stats Final Practice Quiz</h1>
<p class="sub">100 multiple-choice questions built from the Keller 12e suggested problems (Ch 12–17). Pick a set, answer, and read the explanation after each one.</p>

<section id="setup" class="card">
  <div style="font-weight:600;margin-bottom:8px">Choose a set</div>
  <div class="row" id="sets"></div>
  <div style="margin-top:12px" id="topicWrap" class="hidden">
    <select id="topic" aria-label="Topic"></select>
  </div>
  <label class="chk"><input type="checkbox" id="shufQ" checked> Shuffle question order</label>
  <label class="chk"><input type="checkbox" id="shufO" checked> Shuffle answer choices</label>
  <div style="margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <button class="btn" id="start">Start quiz</button>
    <span id="count" class="hint" style="margin:0"></span>
  </div>
  <div id="hist" class="hint"></div>
</section>

<section id="quiz" class="card hidden" aria-live="polite">
  <div class="meta"><span id="pos"></span><span id="tag"></span></div>
  <div class="bar"><i id="prog"></i></div>
  <p class="q" id="stem"></p>
  <div class="opts" id="opts"></div>
  <div id="why" class="why hidden"></div>
  <div class="nav">
    <button class="btn ghost" id="quit">End quiz</button>
    <span id="live" class="hint" style="margin:0"></span>
    <button class="btn" id="next" disabled>Next</button>
  </div>
  <div class="hint">Keys: 1–4 or A–D to answer, Enter for next.</div>
</section>

<section id="done" class="card hidden">
  <p class="score" id="final"></p>
  <p id="finalSub" class="sub" style="margin-top:4px"></p>
  <div class="row" style="margin-bottom:14px">
    <button class="btn" id="retry">Retry missed questions</button>
    <button class="btn ghost" id="again">New quiz</button>
  </div>
  <h3 style="margin:8px 0 6px;font-size:1rem">By topic</h3>
  <table id="byTopic"></table>
  <h3 style="margin:16px 0 4px;font-size:1rem" id="missHead">Review missed</h3>
  <div id="missList"></div>
</section>
</main>
<script>
const Q = [{"id": "A1", "form": "A", "n": 1, "src": "12.42", "q": "Companies that sell groceries over the Internet are called e-grocers. An e-grocer will be profitable only if the average order exceeds $85. Can we infer that an e-grocery will be profitable in this city? Which hypotheses are correct?", "opts": ["H0: μ ≤ 85; H1: μ > 85", "H0: μ = 85; H1: μ ≠ 85", "H0: x̄ ≤ 85; H1: x̄ > 85", "H0: μ > 85; H1: μ ≤ 85"], "ans": 0, "why": "The claim you are asked to test goes in H1. H0 always contains the equality (=, ≤ or ≥) and is about the population parameter (μ or p), never x̄ or p̂.", "topic": "Hypotheses"}, {"id": "A2", "form": "A", "n": 2, "src": "12.19(b)", "q": "A random sample of 11 observations from a normal population has x̄ = 74.5. The population standard deviation is known to be σ = 9. To infer whether μ > 70, which test statistic should be used?", "opts": ["z = (x̄ − μ)/(σ/√n)", "z = (p̂ − p)/√(p(1 − p)/n)", "χ² = (n − 1)s²/σ², df = n − 1", "t = (x̄ − μ)/(s/√n), df = n − 1"], "ans": 0, "why": "σ known ⇒ z = (x̄−μ)/(σ/√n). σ unknown (only s) ⇒ t with n−1 df. Variance/variability ⇒ χ². Nominal data / proportion ⇒ z for p.", "topic": "Choose statistic"}, {"id": "A3", "form": "A", "n": 3, "src": "12.42", "q": "(e-grocer orders: x̄ = 89.27, s = 17.30, n = 85). σ is unknown. What is the test statistic for H0: μ = 85 vs H1: μ > 85?", "opts": ["-2.276", "2.276", "20.980", "0.247"], "ans": 1, "why": "σ unknown ⇒ t = (x̄ − μ₀)/(s/√n), df = n − 1. Watch the sign: it follows x̄ − μ₀.", "topic": "t statistic"}, {"id": "A4", "form": "A", "n": 4, "src": "12.42", "q": "For the same test (t = 2.276, df = 84, H1: μ > 85), what is the p-value?", "opts": ["0.9873", "0.0254", "0.0087", "0.0127"], "ans": 3, "why": "p-value = area in the tail named by H1 under the t distribution (df = n − 1). '<' ⇒ left tail, '>' ⇒ right tail, '≠' ⇒ 2 × one tail.", "topic": "p-value"}, {"id": "A5", "form": "A", "n": 5, "src": "12.42", "q": "With that p-value and α = 0.05, what is the conclusion?", "opts": ["Do not reject H0 — there is not enough evidence to support H1", "Reject H1 — the claim is false", "Reject H0 — there is enough evidence to support H1", "Accept H0 — H0 is proven true"], "ans": 2, "why": "p-value < α ⇒ reject H0 (enough evidence for H1). p-value ≥ α ⇒ do not reject H0. We never 'accept' H0.", "topic": "Conclusion"}, {"id": "A6", "form": "A", "n": 6, "src": "12.19(b)", "q": "A random sample of n = 11 from a normal population has x̄ = 74.5; the population standard deviation is σ = 9. What is the test statistic for H0: μ = 70?", "opts": ["-1.658", "0.500", "1.658", "1.878"], "ans": 2, "why": "σ is given ⇒ z = (x̄ − μ₀)/(σ/√n).", "topic": "z statistic"}, {"id": "A7", "form": "A", "n": 7, "src": "12.78", "q": "Test whether the variance of car speeds exceeds 18 mph². Sample: n = 245, s² = 22.56. What is the value of the test statistic?", "opts": ["273.164", "194.681", "305.813", "307.067"], "ans": 2, "why": "χ² = (n − 1)s² / σ₀², df = n − 1.", "topic": "χ² statistic"}, {"id": "A8", "form": "A", "n": 8, "src": "12.81", "q": "s² = 19.68, n = 25. What is the 95% confidence interval for σ²?", "opts": ["(12, 38.09)", "(17.94, 21.42)", "(12.5, 39.67)", "(38.09, 12)"], "ans": 0, "why": "CI for σ²: LCL = (n−1)s²/χ²_{α/2}, UCL = (n−1)s²/χ²_{1−α/2}. The larger χ² value goes under the LCL.", "topic": "CI for σ²"}, {"id": "A9", "form": "A", "n": 9, "src": "12.51", "q": "Estimate with 95% confidence the mean number of missing teeth of American adults: x̄ = 7.309, s = 5.583, n = 178.", "opts": ["(7.25, 7.37)", "(-3.71, 18.33)", "(6.48, 8.13)", "(6.62, 8.00)"], "ans": 2, "why": "CI for μ (σ unknown): x̄ ± t_{α/2, n−1} · s/√n.", "topic": "CI for μ"}, {"id": "A10", "form": "A", "n": 10, "src": "12.49", "q": "Estimate with 95% confidence the TOTAL for the population (net worth of Canadians 75 and older; N = 2,881,969). Sample: x̄ = 366,203, s = 122,277, n = 452.", "opts": ["(1,022,811,025,814, 1,087,960,361,600)", "(354,900.08, 377,505.92)", "(1,055,385,453,404, 1,055,385,934,010)", "(160,414,836, 170,632,676)"], "ans": 0, "why": "Total = N × (LCL, UCL) of the CI for the mean — multiply both limits by N.", "topic": "CI for a total"}, {"id": "A11", "form": "A", "n": 11, "src": "12.93", "q": "Of 373 attempted steals of second base, 259 were successful. Estimate the population proportion with 95% confidence.", "opts": ["(0.6041, 0.7847)", "(0.6329, 0.7558)", "(0.6476, 0.7411)", "(0.6436, 0.7471)"], "ans": 2, "why": "CI for p: p̂ ± z_{α/2} √(p̂(1−p̂)/n). 90% ⇒ 1.645, 95% ⇒ 1.96.", "topic": "CI for p"}, {"id": "A12", "form": "A", "n": 12, "src": "12.96", "q": "153 successes in n = 165. Test H0: p = 0.92 vs H1: p > 0.92. What is the z statistic?", "opts": ["0.027", "-0.344", "0.344", "0.360"], "ans": 2, "why": "Test of p: z = (p̂ − p₀)/√(p₀(1−p₀)/n). The test uses p₀ in the standard error (the CI uses p̂).", "topic": "z for p"}, {"id": "A13", "form": "A", "n": 13, "src": "Concept (Ch 10/12)", "q": "Which statement correctly interprets a 95% confidence interval for μ?", "opts": ["The interval contains 95% of the sample data", "If we repeated the sampling many times, about 95% of intervals constructed this way would contain μ", "95% of the population values lie inside the interval", "There is a 95% probability that the sample mean x̄ lies inside the interval"], "ans": 1, "why": "A 95% CI means: in repeated sampling, about 95% of intervals built this way contain the true μ. It is not a probability about x̄ or about the data.", "topic": "CI meaning"}, {"id": "A14", "form": "A", "n": 14, "src": "Concept", "q": "In this course the p-value is described as:", "opts": ["the confidence level of the test", "the probability of a Type II error", "the exact error (probability of a Type I error) committed when you reject H0", "the probability that H1 is true"], "ans": 2, "why": "α = P(Type I error) = P(reject H0 | H0 true). The p-value is 'the exact error you commit when you reject H0'.", "topic": "α / p-value"}, {"id": "A15", "form": "A", "n": 15, "src": "13.116", "q": "A contractor builds 15 pairs of identical houses; in each pair one is insulated and one is not, and the heating costs are compared. Which technique should be used?", "opts": ["t-test: paired two sample for means (matched pairs)", "t-test: two-sample assuming equal variances (pooled)", "F-test two-sample for variances", "t-test: two-sample assuming unequal variances"], "ans": 0, "why": "Matched pairs (same unit measured twice / paired units) ⇒ paired t. Independent samples ⇒ F-test first: p > α ⇒ equal variances (pooled t), p < α ⇒ unequal (Welch t). Comparing variability ⇒ F-test.", "topic": "Two-pop technique"}, {"id": "A16", "form": "A", "n": 16, "src": "13.139", "q": "Sample 1: s₁² = 19.38, n₁ = 100; Sample 2: s₂² = 12.7, n₂ = 100. What is the F statistic for H0: σ₁²/σ₂² = 1?", "opts": ["1.6023", "1.5260", "1.2353", "0.6553"], "ans": 1, "why": "F = s₁² / s₂² with df (n₁−1, n₂−1). Sample 1's variance goes on top.", "topic": "F statistic"}, {"id": "A17", "form": "A", "n": 17, "src": "13.22", "q": "Two years ago: x̄₁ = 59.81, s₁ = 7.02, n₁ = 125; This year: x̄₂ = 57.40, s₂ = 6.99, n₂ = 159 (F-test: variances equal). What is the t statistic for H0: μ₁ − μ₂ = 0?", "opts": ["2.879", "3.599", "2.039", "0.243"], "ans": 0, "why": "Equal variances: t = (x̄₁−x̄₂)/√(s_p²(1/n₁+1/n₂)), s_p² = [(n₁−1)s₁²+(n₂−1)s₂²]/(n₁+n₂−2). Unequal: t = (x̄₁−x̄₂)/√(s₁²/n₁+s₂²/n₂).", "topic": "Two-sample t"}, {"id": "A18", "form": "A", "n": 18, "src": "13.116", "q": "Matched pairs, D = Insulated − Uninsulated: x̄_D = -57.4, s_D = 13.14, n_D = 15. What is the test statistic for H0: μ_D = 0?", "opts": ["-16.919", "-4.368", "-19.264", "-65.525"], "ans": 0, "why": "Matched pairs: t = (x̄_D − μ_D)/(s_D/√n_D), df = n_D − 1.", "topic": "Paired t"}, {"id": "A19", "form": "A", "n": 19, "src": "A13.2(a)", "q": "113 people saw the ad and 49 bought; 87 did not see the ad and 21 bought. What is the z statistic for H0: p₁ − p₂ = 0?", "opts": ["2.826", "-2.826", "3.145", "0.403"], "ans": 0, "why": "Two proportions (H0: p₁ − p₂ = 0): pooled p̄ = (x₁+x₂)/(n₁+n₂); z = (p̂₁−p̂₂)/√(p̄(1−p̄)(1/n₁+1/n₂)).", "topic": "Two proportions"}, {"id": "A20", "form": "A", "n": 20, "src": "16.6", "q": "x = commercial length (sec), y = memory test score: x̄ = 38.0, s_x² = 193.9, ȳ = 13.8, s_y² = 47.96, s_xy = 51.86, n = 60. What is the least squares slope b₁?", "opts": ["3.73891", "1.08132", "0.537779", "0.267457"], "ans": 3, "why": "Slope b₁ = s_xy / s_x² (covariance over variance of x).", "topic": "Slope b₁"}, {"id": "A21", "form": "A", "n": 21, "src": "16.6", "q": "Same data (16.6). What is the y-intercept b₀?", "opts": ["34.3091", "3.63662", "23.9634", "-27.2901"], "ans": 1, "why": "Intercept b₀ = ȳ − b₁x̄.", "topic": "Intercept b₀"}, {"id": "A22", "form": "A", "n": 22, "src": "16.6", "q": "Same data (16.6). Which is the correct interpretation of b₁ = 0.2675?", "opts": ["For each 1-unit increase in commercial length (sec), memory test score increases on average by 0.2675", "When commercial length (sec) is 0, memory test score is 0.2675", "26.75% of the variation in memory test score is explained by commercial length (sec)", "For each 1-unit increase in memory test score, commercial length (sec) increases on average by 0.2675"], "ans": 0, "why": "Slope: for each 1-unit increase in x, y changes on average by b₁ (in y's units). R² — not b₁ — measures the strength of fit.", "topic": "Interpret slope"}, {"id": "A23", "form": "A", "n": 23, "src": "16.6", "q": "Same data (16.6). What is the coefficient of determination R²?", "opts": ["0.5378", "0.2675", "0.2892", "0.7108"], "ans": 2, "why": "R² = s_xy² / (s_x² · s_y²) = SSR/SST. It is the share of the variation in y explained by x.", "topic": "R² (simple)"}, {"id": "A24", "form": "A", "n": 24, "src": "17.13", "q": "17.13 lottery regression (n = 100, k = 4): SSR = 615.442, SSE = 804.348, SST = 1,419.79. What is R²?", "opts": ["0.7651", "0.5665", "0.4335", "0.4096"], "ans": 2, "why": "R² = SSR/SST.", "topic": "Multiple regression"}, {"id": "A25", "form": "A", "n": 25, "src": "17.13", "q": "17.13 coefficient p-values: Education 0.0016, Age 0.2501, Children 0.6780, Income 0.0085. Which variables are significant at α = 0.03?", "opts": ["Age, Children", "Education, Income", "Education, Age", "all four"], "ans": 1, "why": "Keep a variable if its P-value < α; variables with P-value ≥ α are not significant.", "topic": "Significant variables"}, {"id": "B1", "form": "B", "n": 1, "src": "12.23", "q": "A courier service advertises that its average delivery time is less than 6 hours for local deliveries. Is there sufficient evidence to support the courier's advertisement? Which hypotheses are correct?", "opts": ["H0: μ ≥ 6; H1: μ < 6", "H0: μ ≤ 6; H1: μ > 6", "H0: μ = 6; H1: μ ≠ 6", "H0: μ < 6; H1: μ ≥ 6"], "ans": 0, "why": "The claim you are asked to test goes in H1. H0 always contains the equality (=, ≤ or ≥) and is about the population parameter (μ or p), never x̄ or p̂.", "topic": "Hypotheses"}, {"id": "B2", "form": "B", "n": 2, "src": "12.42", "q": "The e-grocer sample of 85 orders gives x̄ = 89.27 and s = 17.30 (σ unknown). To test whether μ > 85, which test statistic should be used?", "opts": ["z = (x̄ − μ)/(σ/√n)", "χ² = (n − 1)s²/σ², df = n − 1", "t = (x̄ − μ)/(s/√n), df = n − 1", "z = (p̂ − p)/√(p(1 − p)/n)"], "ans": 2, "why": "σ known ⇒ z = (x̄−μ)/(σ/√n). σ unknown (only s) ⇒ t with n−1 df. Variance/variability ⇒ χ². Nominal data / proportion ⇒ z for p.", "topic": "Choose statistic"}, {"id": "B3", "form": "B", "n": 3, "src": "12.23", "q": "(courier delivery times (hours), n = 12: 3.03, 6.33, 6.50, 5.22, 3.56, 6.76, 7.98, 4.82, 7.96, 4.54, 5.09, 6.46). σ is unknown. What is the test statistic for H0: μ = 6 vs H1: μ < 6?", "opts": ["-0.685", "-0.198", "0.685", "-2.373"], "ans": 0, "why": "σ unknown ⇒ t = (x̄ − μ₀)/(s/√n), df = n − 1. Watch the sign: it follows x̄ − μ₀.", "topic": "t statistic"}, {"id": "B4", "form": "B", "n": 4, "src": "12.23", "q": "For the same test (t = -0.685, df = 11, H1: μ < 6), what is the p-value?", "opts": ["0.2538", "0.7462", "0.1263", "0.5075"], "ans": 0, "why": "p-value = area in the tail named by H1 under the t distribution (df = n − 1). '<' ⇒ left tail, '>' ⇒ right tail, '≠' ⇒ 2 × one tail.", "topic": "p-value"}, {"id": "B5", "form": "B", "n": 5, "src": "12.23", "q": "With that p-value and α = 0.05, what is the conclusion?", "opts": ["Accept H0 — H0 is proven true", "Reject H1 — the claim is false", "Reject H0 — there is enough evidence to support H1", "Do not reject H0 — there is not enough evidence to support H1"], "ans": 3, "why": "p-value < α ⇒ reject H0 (enough evidence for H1). p-value ≥ α ⇒ do not reject H0. We never 'accept' H0.", "topic": "Conclusion"}, {"id": "B6", "form": "B", "n": 6, "src": "12.20(b)", "q": "A random sample of n = 10 from a normal population has x̄ = 103; the population standard deviation is σ = 17. What is the test statistic for H0: μ = 110?", "opts": ["-1.482", "1.302", "-1.302", "-0.412"], "ans": 2, "why": "σ is given ⇒ z = (x̄ − μ₀)/(σ/√n).", "topic": "z statistic"}, {"id": "B7", "form": "B", "n": 7, "src": "12.74", "q": "Test whether the variance of final-exam marks has decreased below 250. Sample: n = 10, s² = 210.2. What is the value of the test statistic?", "opts": ["8.253", "8.409", "7.568", "10.703"], "ans": 2, "why": "χ² = (n − 1)s² / σ₀², df = n − 1.", "topic": "χ² statistic"}, {"id": "B8", "form": "B", "n": 8, "src": "12.76", "q": "s² = 15.43, n = 10. What is the 95% confidence interval for σ²?", "opts": ["(8.113, 57.15)", "(51.44, 7.302)", "(7.302, 51.44)", "(13, 17.87)"], "ans": 2, "why": "CI for σ²: LCL = (n−1)s²/χ²_{α/2}, UCL = (n−1)s²/χ²_{1−α/2}. The larger χ² value goes under the LCL.", "topic": "CI for σ²"}, {"id": "B9", "form": "B", "n": 9, "src": "12.46", "q": "Estimate with 95% confidence the mean monthly student-loan payment: x̄ = 27,852, s = 9,252, n = 347.", "opts": ["(9,654.76, 46,049.24)", "(27,799.56, 27,904.44)", "(26,875.12, 28,828.88)", "(27,034.97, 28,669.03)"], "ans": 2, "why": "CI for μ (σ unknown): x̄ ± t_{α/2, n−1} · s/√n.", "topic": "CI for μ"}, {"id": "B10", "form": "B", "n": 10, "src": "12.45", "q": "Estimate with 95% confidence the TOTAL for the population (annual household cost of water in Toronto; N = 2,235,145 households). Sample: x̄ = 1,125, s = 317.7, n = 364.", "opts": ["(2,441,344,925, 2,587,731,325)", "(2,514,537,500, 2,514,538,750)", "(1,092.25, 1,157.75)", "(397,580, 421,420)"], "ans": 0, "why": "Total = N × (LCL, UCL) of the CI for the mean — multiply both limits by N.", "topic": "CI for a total"}, {"id": "B11", "form": "B", "n": 11, "src": "12.98", "q": "68 of 400 train travelers had not bought a ticket. Estimate the population proportion with 95% confidence.", "opts": ["(0.1216, 0.2184)", "(0.1210, 0.2210)", "(0.1332, 0.2068)", "(0.0964, 0.2436)"], "ans": 2, "why": "CI for p: p̂ ± z_{α/2} √(p̂(1−p̂)/n). 90% ⇒ 1.645, 95% ⇒ 1.96.", "topic": "CI for p"}, {"id": "B12", "form": "B", "n": 12, "src": "12.94", "q": "41 successes in n = 200. Test H0: p = 0.25 vs H1: p < 0.25. What is the z statistic?", "opts": ["-1.470", "1.470", "-1.576", "-0.104"], "ans": 0, "why": "Test of p: z = (p̂ − p₀)/√(p₀(1−p₀)/n). The test uses p₀ in the standard error (the CI uses p̂).", "topic": "z for p"}, {"id": "B13", "form": "B", "n": 13, "src": "Concept (Ch 10/12)", "q": "Which statement correctly interprets a 95% confidence interval for μ?", "opts": ["95% of the population values lie inside the interval", "If we repeated the sampling many times, about 95% of intervals constructed this way would contain μ", "The interval contains 95% of the sample data", "There is a 95% probability that the sample mean x̄ lies inside the interval"], "ans": 1, "why": "A 95% CI means: in repeated sampling, about 95% of intervals built this way contain the true μ. It is not a probability about x̄ or about the data.", "topic": "CI meaning"}, {"id": "B14", "form": "B", "n": 14, "src": "Concept", "q": "The significance level α is:", "opts": ["the probability of rejecting H0 when H0 is true (Type I error)", "the probability of not rejecting a false H0", "the probability that H0 is true", "the p-value of the test"], "ans": 0, "why": "α = P(Type I error) = P(reject H0 | H0 true). The p-value is 'the exact error you commit when you reject H0'.", "topic": "α / p-value"}, {"id": "B15", "form": "B", "n": 15, "src": "13.25", "q": "Incomes of apprenticeship graduates (n = 288) vs community-college graduates (n = 311) are compared; an F-test of the two variances gives a two-tail p-value of 0.042. Which technique should be used?", "opts": ["t-test: two-sample assuming equal variances (pooled)", "F-test two-sample for variances", "t-test: paired two sample for means (matched pairs)", "t-test: two-sample assuming unequal variances"], "ans": 3, "why": "Matched pairs (same unit measured twice / paired units) ⇒ paired t. Independent samples ⇒ F-test first: p > α ⇒ equal variances (pooled t), p < α ⇒ unequal (Welch t). Comparing variability ⇒ F-test.", "topic": "Two-pop technique"}, {"id": "B16", "form": "B", "n": 16, "src": "13.140", "q": "Sample 1: s₁² = 41,309, n₁ = 100; Sample 2: s₂² = 19,850, n₂ = 100. What is the F statistic for H0: σ₁²/σ₂² = 1?", "opts": ["1.4426", "2.1851", "0.4805", "2.0811"], "ans": 3, "why": "F = s₁² / s₂² with df (n₁−1, n₂−1). Sample 1's variance goes on top.", "topic": "F statistic"}, {"id": "B17", "form": "B", "n": 17, "src": "13.23", "q": "Male: x̄₁ = 10.23, s₁ = 2.87, n₁ = 100; Female: x̄₂ = 9.66, s₂ = 2.90, n₂ = 100 (F-test: variances equal). What is the t statistic for H0: μ₁ − μ₂ = 0?", "opts": ["1.397", "0.140", "1.746", "0.988"], "ans": 0, "why": "Equal variances: t = (x̄₁−x̄₂)/√(s_p²(1/n₁+1/n₂)), s_p² = [(n₁−1)s₁²+(n₂−1)s₂²]/(n₁+n₂−2). Unequal: t = (x̄₁−x̄₂)/√(s₁²/n₁+s₂²/n₂).", "topic": "Two-sample t"}, {"id": "B18", "form": "B", "n": 18, "src": "13.114", "q": "Matched pairs, D = Waiter − Waitress: x̄_D = -1.16, s_D = 2.22, n_D = 50. What is the test statistic for H0: μ_D = 0?", "opts": ["-26.126", "-4.106", "-0.523", "-3.695"], "ans": 3, "why": "Matched pairs: t = (x̄_D − μ_D)/(s_D/√n_D), df = n_D − 1.", "topic": "Paired t"}, {"id": "B19", "form": "B", "n": 19, "src": "A13.4", "q": "Without ABS 42 of 500 cars had accidents; with ABS 38 of 500. What is the z statistic for H0: p₁ − p₂ = 0?", "opts": ["0.029", "-0.466", "0.499", "0.466"], "ans": 3, "why": "Two proportions (H0: p₁ − p₂ = 0): pooled p̄ = (x₁+x₂)/(n₁+n₂); z = (p̂₁−p̂₂)/√(p̄(1−p̄)(1/n₁+1/n₂)).", "topic": "Two proportions"}, {"id": "B20", "form": "B", "n": 20, "src": "16.10", "q": "x = age (years), y = time to complete the census (min): x̄ = 45.49, s_x² = 107.51, ȳ = 11.55, s_y² = 42.54, s_xy = 9.67, n = 229. What is the least squares slope b₁?", "opts": ["0.227315", "0.142989", "0.0899451", "11.1179"], "ans": 2, "why": "Slope b₁ = s_xy / s_x² (covariance over variance of x).", "topic": "Slope b₁"}, {"id": "B21", "form": "B", "n": 21, "src": "16.10", "q": "Same data (16.10). What is the y-intercept b₀?", "opts": ["7.4584", "15.6416", "44.4511", "1.20942"], "ans": 0, "why": "Intercept b₀ = ȳ − b₁x̄.", "topic": "Intercept b₀"}, {"id": "B22", "form": "B", "n": 22, "src": "16.10", "q": "Same data (16.10). Which is the correct interpretation of b₁ = 0.08995?", "opts": ["8.99% of the variation in time to complete the census (min) is explained by age (years)", "When age (years) is 0, time to complete the census (min) is 0.08995", "For each 1-unit increase in age (years), time to complete the census (min) increases on average by 0.08995", "For each 1-unit increase in time to complete the census (min), age (years) increases on average by 0.08995"], "ans": 2, "why": "Slope: for each 1-unit increase in x, y changes on average by b₁ (in y's units). R² — not b₁ — measures the strength of fit.", "topic": "Interpret slope"}, {"id": "B23", "form": "B", "n": 23, "src": "16.10", "q": "Same data (16.10). What is the coefficient of determination R²?", "opts": ["0.1430", "0.0899", "0.0204", "0.9796"], "ans": 2, "why": "R² = s_xy² / (s_x² · s_y²) = SSR/SST. It is the share of the variation in y explained by x.", "topic": "R² (simple)"}, {"id": "B24", "form": "B", "n": 24, "src": "17.13", "q": "17.13 lottery regression (n = 100, k = 4): SSR = 615.442, SSE = 804.348, SST = 1,419.79. What is the adjusted R²?", "opts": ["0.4335", "0.4039", "0.4564", "0.4096"], "ans": 3, "why": "Adjusted R² = 1 − [SSE/(n−k−1)] / [SST/(n−1)].", "topic": "Multiple regression"}, {"id": "B25", "form": "B", "n": 25, "src": "17.13", "q": "17.13 coefficient p-values: Education 0.0016, Age 0.2501, Children 0.6780, Income 0.0085. Which variables are significant at α = 0.05?", "opts": ["Education, Income", "Age, Children", "Education, Age", "all four"], "ans": 0, "why": "Keep a variable if its P-value < α; variables with P-value ≥ α are not significant.", "topic": "Significant variables"}, {"id": "C1", "form": "C", "n": 1, "src": "12.26", "q": "A federal agency inspects packages whose label states the contents weigh 8 ounces. Can we conclude that on average the containers are mislabeled? Which hypotheses are correct?", "opts": ["H0: μ = 8; H1: μ ≠ 8", "H0: μ ≤ 8; H1: μ > 8", "H0: μ ≠ 8; H1: μ = 8", "H0: μ ≥ 8; H1: μ < 8"], "ans": 0, "why": "The claim you are asked to test goes in H1. H0 always contains the equality (=, ≤ or ≥) and is about the population parameter (μ or p), never x̄ or p̂.", "topic": "Hypotheses"}, {"id": "C2", "form": "C", "n": 2, "src": "12.78", "q": "An expert believes accidents are unacceptably high when the variance of car speeds exceeds 18 mph². Which test statistic tests this claim?", "opts": ["z = (p̂ − p)/√(p(1 − p)/n)", "χ² = (n − 1)s²/σ², df = n − 1", "t = (x̄ − μ)/(s/√n), df = n − 1", "z = (x̄ − μ)/(σ/√n)"], "ans": 1, "why": "σ known ⇒ z = (x̄−μ)/(σ/√n). σ unknown (only s) ⇒ t with n−1 df. Variance/variability ⇒ χ². Nominal data / proportion ⇒ z for p.", "topic": "Choose statistic"}, {"id": "C3", "form": "C", "n": 3, "src": "12.26", "q": "(package weights (oz), n = 18: 7.80, 7.91, 7.93, 7.99, 7.94, 7.75, 7.97, 7.95, 7.79, 8.06, 7.82, 7.89, 7.92, 7.87, 7.92, 7.98, 8.05, 7.91). σ is unknown. What is the test statistic for H0: μ = 8 vs H1: μ ≠ 8?", "opts": ["-4.312", "-1.016", "-18.295", "4.312"], "ans": 0, "why": "σ unknown ⇒ t = (x̄ − μ₀)/(s/√n), df = n − 1. Watch the sign: it follows x̄ − μ₀.", "topic": "t statistic"}, {"id": "C4", "form": "C", "n": 4, "src": "12.26", "q": "For the same test (t = -4.312, df = 17, H1: μ ≠ 8), what is the p-value?", "opts": ["0.0002", "0.0030", "0.9995", "0.0005"], "ans": 3, "why": "p-value = area in the tail named by H1 under the t distribution (df = n − 1). '<' ⇒ left tail, '>' ⇒ right tail, '≠' ⇒ 2 × one tail.", "topic": "p-value"}, {"id": "C5", "form": "C", "n": 5, "src": "12.26", "q": "With that p-value and α = 0.01, what is the conclusion?", "opts": ["Accept H0 — H0 is proven true", "Reject H0 — there is enough evidence to support H1", "Do not reject H0 — there is not enough evidence to support H1", "Reject H1 — the claim is false"], "ans": 1, "why": "p-value < α ⇒ reject H0 (enough evidence for H1). p-value ≥ α ⇒ do not reject H0. We never 'accept' H0.", "topic": "Conclusion"}, {"id": "C6", "form": "C", "n": 6, "src": "12.21(b)", "q": "A random sample of n = 1500 from a normal population has x̄ = 14; the population standard deviation is σ = 25. What is the test statistic for H0: μ = 15?", "opts": ["1.549", "-1.674", "-1.549", "-0.040"], "ans": 2, "why": "σ is given ⇒ z = (x̄ − μ₀)/(σ/√n).", "topic": "z statistic"}, {"id": "C7", "form": "C", "n": 7, "src": "12.77", "q": "Test whether the variance of daily demand differs from 250. Sample: n = 25, s² = 270.6. What is the value of the test statistic?", "opts": ["25.976", "24.968", "22.175", "27.058"], "ans": 0, "why": "χ² = (n − 1)s² / σ₀², df = n − 1.", "topic": "χ² statistic"}, {"id": "C8", "form": "C", "n": 8, "src": "12.79", "q": "s² = 4.725, n = 90. What is the 95% confidence interval for σ²?", "opts": ["(3.635, 6.563)", "(3.595, 6.49)", "(4.276, 5.174)", "(6.49, 3.595)"], "ans": 1, "why": "CI for σ²: LCL = (n−1)s²/χ²_{α/2}, UCL = (n−1)s²/χ²_{1−α/2}. The larger χ² value goes under the LCL.", "topic": "CI for σ²"}, {"id": "C9", "form": "C", "n": 9, "src": "12.47", "q": "Estimate with 95% confidence the mean taxable income of waiters and waitresses: x̄ = 354.6, s = 90.32, n = 681.", "opts": ["(347.80, 361.40)", "(177.26, 531.94)", "(354.34, 354.86)", "(348.91, 360.29)"], "ans": 0, "why": "CI for μ (σ unknown): x̄ ± t_{α/2, n−1} · s/√n.", "topic": "CI for μ"}, {"id": "C10", "form": "C", "n": 10, "src": "12.44", "q": "Estimate with 95% confidence the TOTAL for the population (household debt in Canada; N = 12.4 million households). Sample: x̄ = 96,100, s = 34,468, n = 473.", "opts": ["(92,985.78, 99,214.22)", "(1,153,023,727,958, 1,230,256,272,042)", "(1,191,639,932,270, 1,191,640,067,730)", "(43,982,276, 46,928,324)"], "ans": 1, "why": "Total = N × (LCL, UCL) of the CI for the mean — multiply both limits by N.", "topic": "CI for a total"}, {"id": "C11", "form": "C", "n": 11, "src": "12.95", "q": "204 of 314 business graduates used a statistical technique within a year. Estimate the population proportion with 90% confidence.", "opts": ["(0.6033, 0.6981)", "(0.6054, 0.6940)", "(0.5969, 0.7024)", "(0.5712, 0.7282)"], "ans": 1, "why": "CI for p: p̂ ± z_{α/2} √(p̂(1−p̂)/n). 90% ⇒ 1.645, 95% ⇒ 1.96.", "topic": "CI for p"}, {"id": "C12", "form": "C", "n": 12, "src": "12.84(a)", "q": "63 successes in n = 100. Test H0: p = 0.6 vs H1: p > 0.6. What is the z statistic?", "opts": ["-0.612", "0.612", "0.621", "0.061"], "ans": 1, "why": "Test of p: z = (p̂ − p₀)/√(p₀(1−p₀)/n). The test uses p₀ in the standard error (the CI uses p̂).", "topic": "z for p"}, {"id": "C13", "form": "C", "n": 13, "src": "Concept (Ch 10/12)", "q": "Which statement correctly interprets a 95% confidence interval for μ?", "opts": ["If we repeated the sampling many times, about 95% of intervals constructed this way would contain μ", "There is a 95% probability that the sample mean x̄ lies inside the interval", "95% of the population values lie inside the interval", "The interval contains 95% of the sample data"], "ans": 0, "why": "A 95% CI means: in repeated sampling, about 95% of intervals built this way contain the true μ. It is not a probability about x̄ or about the data.", "topic": "CI meaning"}, {"id": "C14", "form": "C", "n": 14, "src": "Concept", "q": "In this course the p-value is described as:", "opts": ["the probability that H1 is true", "the probability of a Type II error", "the exact error (probability of a Type I error) committed when you reject H0", "the confidence level of the test"], "ans": 2, "why": "α = P(Type I error) = P(reject H0 | H0 true). The p-value is 'the exact error you commit when you reject H0'.", "topic": "α / p-value"}, {"id": "C15", "form": "C", "n": 15, "src": "13.22", "q": "Ages of cruise passengers two years ago (n = 125) and this year (n = 159) are compared; an F-test of the two variances gives a two-tail p-value of 0.95. Which technique should be used?", "opts": ["t-test: paired two sample for means (matched pairs)", "F-test two-sample for variances", "t-test: two-sample assuming equal variances (pooled)", "t-test: two-sample assuming unequal variances"], "ans": 2, "why": "Matched pairs (same unit measured twice / paired units) ⇒ paired t. Independent samples ⇒ F-test first: p > α ⇒ equal variances (pooled t), p < α ⇒ unequal (Welch t). Comparing variability ⇒ F-test.", "topic": "Two-pop technique"}, {"id": "C16", "form": "C", "n": 16, "src": "13.141", "q": "Sample 1: s₁² = 0.0261, n₁ = 52; Sample 2: s₂² = 0.0875, n₂ = 52. What is the F statistic for H0: σ₁²/σ₂² = 1?", "opts": ["0.2983", "0.3132", "0.5462", "3.3525"], "ans": 0, "why": "F = s₁² / s₂² with df (n₁−1, n₂−1). Sample 1's variance goes on top.", "topic": "F statistic"}, {"id": "C17", "form": "C", "n": 17, "src": "13.25", "q": "Apprentice: x̄₁ = 72,955, s₁ = 15,389, n₁ = 288; College: x̄₂ = 67,964, s₂ = 13,679, n₂ = 311 (F-test: variances unequal). What is the t statistic for H0: μ₁ − μ₂ = 0?", "opts": ["2.966", "0.242", "4.183", "5.228"], "ans": 2, "why": "Equal variances: t = (x̄₁−x̄₂)/√(s_p²(1/n₁+1/n₂)), s_p² = [(n₁−1)s₁²+(n₂−1)s₂²]/(n₁+n₂−2). Unequal: t = (x̄₁−x̄₂)/√(s₁²/n₁+s₂²/n₂).", "topic": "Two-sample t"}, {"id": "C18", "form": "C", "n": 18, "src": "13.118", "q": "Matched pairs, D = Last year − Year before: x̄_D = -183.3, s_D = 1,569, n_D = 170. What is the test statistic for H0: μ_D = 0?", "opts": ["-1.523", "-1.680", "-0.117", "-19.860"], "ans": 0, "why": "Matched pairs: t = (x̄_D − μ_D)/(s_D/√n_D), df = n_D − 1.", "topic": "Paired t"}, {"id": "C19", "form": "C", "n": 19, "src": "13.173", "q": "Machine A produced 11 defectives in 200; Machine B produced 22 defectives in 200. What is the z statistic for H0: p₁ − p₂ = 0?", "opts": ["-2.150", "-1.999", "-0.200", "1.999"], "ans": 1, "why": "Two proportions (H0: p₁ − p₂ = 0): pooled p̄ = (x₁+x₂)/(n₁+n₂); z = (p̂₁−p̂₂)/√(p̄(1−p̄)(1/n₁+1/n₂)).", "topic": "Two proportions"}, {"id": "C20", "form": "C", "n": 20, "src": "16.12", "q": "x = course yardage, y = time to play a round (min): x̄ = 5,982, s_x² = 265,811, ȳ = 253.5, s_y² = 1,313, s_xy = 4,314, n = 404. What is the least squares slope b₁?", "opts": ["3.28561", "61.6159", "0.0162296", "0.23092"], "ans": 2, "why": "Slope b₁ = s_xy / s_x² (covariance over variance of x).", "topic": "Slope b₁"}, {"id": "C21", "form": "C", "n": 21, "src": "16.12", "q": "Same data (16.12). What is the y-intercept b₀?", "opts": ["156.415", "-19401", "5977.89", "350.585"], "ans": 0, "why": "Intercept b₀ = ȳ − b₁x̄.", "topic": "Intercept b₀"}, {"id": "C22", "form": "C", "n": 22, "src": "16.12", "q": "Same data (16.12). Which is the correct interpretation of b₁ = 0.01623?", "opts": ["1.62% of the variation in time to play a round (min) is explained by course yardage", "For each 1-unit increase in time to play a round (min), course yardage increases on average by 0.01623", "When course yardage is 0, time to play a round (min) is 0.01623", "For each 1-unit increase in course yardage, time to play a round (min) increases on average by 0.01623"], "ans": 3, "why": "Slope: for each 1-unit increase in x, y changes on average by b₁ (in y's units). R² — not b₁ — measures the strength of fit.", "topic": "Interpret slope"}, {"id": "C23", "form": "C", "n": 23, "src": "16.12", "q": "Same data (16.12). What is the coefficient of determination R²?", "opts": ["0.9467", "0.2309", "0.0533", "0.0162"], "ans": 2, "why": "R² = s_xy² / (s_x² · s_y²) = SSR/SST. It is the share of the variation in y explained by x.", "topic": "R² (simple)"}, {"id": "C24", "form": "C", "n": 24, "src": "17.13", "q": "17.13 lottery regression (n = 100, k = 4): SSR = 615.442, SSE = 804.348, SST = 1,419.79. What is the F statistic for testing the validity of the model?", "opts": ["18.937", "0.055", "0.765", "18.172"], "ans": 3, "why": "F = MSR/MSE = (SSR/k) / (SSE/(n−k−1)).", "topic": "Multiple regression"}, {"id": "C25", "form": "C", "n": 25, "src": "17.13", "q": "17.13 coefficient p-values: Education 0.0016, Age 0.2501, Children 0.6780, Income 0.0085. Which variables are significant at α = 0.01?", "opts": ["Education, Age", "Education, Income", "Age, Children", "all four"], "ans": 1, "why": "Keep a variable if its P-value < α; variables with P-value ≥ α are not significant.", "topic": "Significant variables"}, {"id": "D1", "form": "D", "n": 1, "src": "12.96", "q": "Before the recent downturn an airline bragged that 92% of its flights were on time. Can we conclude that the airline's on-time performance has improved? Which hypotheses are correct?", "opts": ["H0: μ ≤ 0.92; H1: μ > 0.92", "H0: p ≤ 0.92; H1: p > 0.92", "H0: p = 0.92; H1: p ≠ 0.92", "H0: p > 0.92; H1: p ≤ 0.92"], "ans": 1, "why": "The claim you are asked to test goes in H1. H0 always contains the equality (=, ≤ or ≥) and is about the population parameter (μ or p), never x̄ or p̂.", "topic": "Hypotheses"}, {"id": "D2", "form": "D", "n": 2, "src": "12.96", "q": "153 of 165 flights were on time. To test whether more than 92% of flights are on time, which test statistic should be used?", "opts": ["z = (x̄ − μ)/(σ/√n)", "χ² = (n − 1)s²/σ², df = n − 1", "t = (x̄ − μ)/(s/√n), df = n − 1", "z = (p̂ − p)/√(p(1 − p)/n)"], "ans": 3, "why": "σ known ⇒ z = (x̄−μ)/(σ/√n). σ unknown (only s) ⇒ t with n−1 df. Variance/variability ⇒ χ². Nominal data / proportion ⇒ z for p.", "topic": "Choose statistic"}, {"id": "D3", "form": "D", "n": 3, "src": "12.30", "q": "(percent of books returned, n = 10: 4, 15, 11, 7, 5, 9, 4, 3, 5, 8). σ is unknown. What is the test statistic for H0: μ = 10 vs H1: μ < 10?", "opts": ["-2.442", "-0.772", "-7.723", "2.442"], "ans": 0, "why": "σ unknown ⇒ t = (x̄ − μ₀)/(s/√n), df = n − 1. Watch the sign: it follows x̄ − μ₀.", "topic": "t statistic"}, {"id": "D4", "form": "D", "n": 4, "src": "12.30", "q": "For the same test (t = -2.442, df = 9, H1: μ < 10), what is the p-value?", "opts": ["0.9814", "0.0066", "0.0372", "0.0186"], "ans": 3, "why": "p-value = area in the tail named by H1 under the t distribution (df = n − 1). '<' ⇒ left tail, '>' ⇒ right tail, '≠' ⇒ 2 × one tail.", "topic": "p-value"}, {"id": "D5", "form": "D", "n": 5, "src": "12.30", "q": "With that p-value and α = 0.1, what is the conclusion?", "opts": ["Reject H1 — the claim is false", "Accept H0 — H0 is proven true", "Reject H0 — there is enough evidence to support H1", "Do not reject H0 — there is not enough evidence to support H1"], "ans": 2, "why": "p-value < α ⇒ reject H0 (enough evidence for H1). p-value ≥ α ⇒ do not reject H0. We never 'accept' H0.", "topic": "Conclusion"}, {"id": "D6", "form": "D", "n": 6, "src": "12.22(b)", "q": "A random sample of n = 1000 from a normal population has x̄ = 405; the population standard deviation is σ = 100. What is the test statistic for H0: μ = 400?", "opts": ["0.050", "1.708", "-1.581", "1.581"], "ans": 3, "why": "σ is given ⇒ z = (x̄ − μ₀)/(σ/√n).", "topic": "z statistic"}, {"id": "D7", "form": "D", "n": 7, "src": "12.80", "q": "Test whether the variance of bulb lives is less than 200 hours². Sample: n = 100, s² = 174.5. What is the value of the test statistic?", "opts": ["86.363", "92.466", "113.487", "87.235"], "ans": 0, "why": "χ² = (n − 1)s² / σ₀², df = n − 1.", "topic": "χ² statistic"}, {"id": "D8", "form": "D", "n": 8, "src": "12.73", "q": "s² = 0.0009268, n = 8. What is the 90% confidence interval for σ²?", "opts": ["(0.0004612, 0.002993)", "(0.0005271, 0.003421)", "(-0.02017, 0.02202)", "(0.002993, 0.0004612)"], "ans": 0, "why": "CI for σ²: LCL = (n−1)s²/χ²_{α/2}, UCL = (n−1)s²/χ²_{1−α/2}. The larger χ² value goes under the LCL.", "topic": "CI for σ²"}, {"id": "D9", "form": "D", "n": 9, "src": "12.36", "q": "Estimate with 95% confidence the mean tip percentage left by restaurant customers: x̄ = 15.77, s = 4.26, n = 94.", "opts": ["(7.31, 24.23)", "(15.68, 15.86)", "(14.90, 16.64)", "(15.05, 16.49)"], "ans": 2, "why": "CI for μ (σ unknown): x̄ ± t_{α/2, n−1} · s/√n.", "topic": "CI for μ"}, {"id": "D10", "form": "D", "n": 10, "src": "12.53", "q": "Estimate with 95% confidence the TOTAL for the population (charitable donation per donor; N = 23.8 million Canadian donors). Sample: x̄ = 530.7, s = 97.17, n = 485.", "opts": ["(12,630,659,809, 12,630,660,191)", "(253,185, 261,594)", "(522.03, 539.37)", "(12,424,324,594, 12,836,995,406)"], "ans": 3, "why": "Total = N × (LCL, UCL) of the CI for the mean — multiply both limits by N.", "topic": "CI for a total"}, {"id": "D11", "form": "D", "n": 11, "src": "12.97", "q": "97 of 344 CEOs have an MBA. Estimate the population proportion with 95% confidence.", "opts": ["(0.2344, 0.3295)", "(0.2291, 0.3368)", "(0.2195, 0.3445)", "(0.1938, 0.3702)"], "ans": 0, "why": "CI for p: p̂ ± z_{α/2} √(p̂(1−p̂)/n). 90% ⇒ 1.645, 95% ⇒ 1.96.", "topic": "CI for p"}, {"id": "D12", "form": "D", "n": 12, "src": "12.85(a)", "q": "73 successes in n = 100. Test H0: p = 0.7 vs H1: p > 0.7. What is the z statistic?", "opts": ["0.655", "0.676", "-0.655", "0.065"], "ans": 0, "why": "Test of p: z = (p̂ − p₀)/√(p₀(1−p₀)/n). The test uses p₀ in the standard error (the CI uses p̂).", "topic": "z for p"}, {"id": "D13", "form": "D", "n": 13, "src": "Concept (Ch 10/12)", "q": "Which statement correctly interprets a 95% confidence interval for μ?", "opts": ["If we repeated the sampling many times, about 95% of intervals constructed this way would contain μ", "The interval contains 95% of the sample data", "95% of the population values lie inside the interval", "There is a 95% probability that the sample mean x̄ lies inside the interval"], "ans": 0, "why": "A 95% CI means: in repeated sampling, about 95% of intervals built this way contain the true μ. It is not a probability about x̄ or about the data.", "topic": "CI meaning"}, {"id": "D14", "form": "D", "n": 14, "src": "Concept", "q": "The significance level α is:", "opts": ["the probability of rejecting H0 when H0 is true (Type I error)", "the p-value of the test", "the probability that H0 is true", "the probability of not rejecting a false H0"], "ans": 0, "why": "α = P(Type I error) = P(reject H0 | H0 true). The p-value is 'the exact error you commit when you reject H0'.", "topic": "α / p-value"}, {"id": "D15", "form": "D", "n": 15, "src": "13.139", "q": "A manager wants to know whether service times in week 1 are more variable than in week 2 (independent samples of 100). Which technique should be used?", "opts": ["t-test: two-sample assuming unequal variances", "t-test: two-sample assuming equal variances (pooled)", "t-test: paired two sample for means (matched pairs)", "F-test two-sample for variances"], "ans": 3, "why": "Matched pairs (same unit measured twice / paired units) ⇒ paired t. Independent samples ⇒ F-test first: p > α ⇒ equal variances (pooled t), p < α ⇒ unequal (Welch t). Comparing variability ⇒ F-test.", "topic": "Two-pop technique"}, {"id": "D16", "form": "D", "n": 16, "src": "13.142", "q": "Sample 1: s₁² = 3.35, n₁ = 100; Sample 2: s₂² = 10.95, n₂ = 100. What is the F statistic for H0: σ₁²/σ₂² = 1?", "opts": ["0.3059", "0.5531", "0.3212", "3.2687"], "ans": 0, "why": "F = s₁² / s₂² with df (n₁−1, n₂−1). Sample 1's variance goes on top.", "topic": "F statistic"}, {"id": "D17", "form": "D", "n": 17, "src": "13.35", "q": "Without textbook: x̄₁ = 66.80, s₁ = 6.85, n₁ = 202; With textbook: x̄₂ = 63.71, s₂ = 5.90, n₂ = 173 (F-test: variances unequal). What is the t statistic for H0: μ₁ − μ₂ = 0?", "opts": ["5.866", "3.321", "0.342", "4.693"], "ans": 3, "why": "Equal variances: t = (x̄₁−x̄₂)/√(s_p²(1/n₁+1/n₂)), s_p² = [(n₁−1)s₁²+(n₂−1)s₂²]/(n₁+n₂−2). Unequal: t = (x̄₁−x̄₂)/√(s₁²/n₁+s₂²/n₂).", "topic": "Two-sample t"}, {"id": "D18", "form": "D", "n": 18, "src": "13.120", "q": "Matched pairs, D = Company 1 − Company 2: x̄_D = 520.9, s_D = 1,855, n_D = 55. What is the test statistic for H0: μ_D = 0?", "opts": ["0.281", "2.312", "15.444", "2.083"], "ans": 3, "why": "Matched pairs: t = (x̄_D − μ_D)/(s_D/√n_D), df = n_D − 1.", "topic": "Paired t"}, {"id": "D19", "form": "D", "n": 19, "src": "13.177", "q": "501 of 656 men vs 486 of 669 women answered 'yes'. What is the z statistic for H0: p₁ − p₂ = 0?", "opts": ["-1.556", "1.556", "1.667", "0.085"], "ans": 1, "why": "Two proportions (H0: p₁ − p₂ = 0): pooled p̄ = (x₁+x₂)/(n₁+n₂); z = (p̂₁−p̂₂)/√(p̄(1−p̄)(1/n₁+1/n₂)).", "topic": "Two proportions"}, {"id": "D20", "form": "D", "n": 20, "src": "16.8", "q": "x = city population, y = property tax ($): x̄ = 2,339,626, s_x² = 5,994,336,071,650, ȳ = 3,058, s_y² = 1,186,973, s_xy = 880,267,351, n = 582. What is the least squares slope b₁?", "opts": ["0.330007", "741.607", "6809.68", "0.00014685"], "ans": 3, "why": "Slope b₁ = s_xy / s_x² (covariance over variance of x).", "topic": "Slope b₁"}, {"id": "D21", "form": "D", "n": 21, "src": "16.8", "q": "Same data (16.8). What is the y-intercept b₀?", "opts": ["-1.73508e+09", "3401.57", "2714.43", "2.33963e+06"], "ans": 2, "why": "Intercept b₀ = ȳ − b₁x̄.", "topic": "Intercept b₀"}, {"id": "D22", "form": "D", "n": 22, "src": "16.8", "q": "Same data (16.8). Which is the correct interpretation of b₁ = 0.0001468?", "opts": ["For each 1-unit increase in city population, property tax ($) increases on average by 0.0001468", "0.01% of the variation in property tax ($) is explained by city population", "When city population is 0, property tax ($) is 0.0001468", "For each 1-unit increase in property tax ($), city population increases on average by 0.0001468"], "ans": 0, "why": "Slope: for each 1-unit increase in x, y changes on average by b₁ (in y's units). R² — not b₁ — measures the strength of fit.", "topic": "Interpret slope"}, {"id": "D23", "form": "D", "n": 23, "src": "16.8", "q": "Same data (16.8). What is the coefficient of determination R²?", "opts": ["0.3300", "0.1089", "0.0001", "0.8911"], "ans": 1, "why": "R² = s_xy² / (s_x² · s_y²) = SSR/SST. It is the share of the variation in y explained by x.", "topic": "R² (simple)"}, {"id": "D24", "form": "D", "n": 24, "src": "17.13", "q": "17.13 lottery regression (n = 100, k = 4): SSR = 615.442, SSE = 804.348, SST = 1,419.79. What is the standard error of estimate s_ε?", "opts": ["2.8649", "2.9098", "3.7870", "8.4668"], "ans": 1, "why": "s_ε = √MSE = √(SSE/(n−k−1)).", "topic": "Multiple regression"}, {"id": "D25", "form": "D", "n": 25, "src": "17.13", "q": "17.13 coefficient p-values: Education 0.0016, Age 0.2501, Children 0.6780, Income 0.0085. Which variables are significant at α = 0.3?", "opts": ["Education, Age, Income", "Children", "Education, Age", "all four"], "ans": 0, "why": "Keep a variable if its P-value < α; variables with P-value ≥ α are not significant.", "topic": "Significant variables"}];
const $ = id => document.getElementById(id);
const store = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
const SETS = [["A","Form A"],["B","Form B"],["C","Form C"],["D","Form D"],["R25","Random 25"],["ALL","All 100"],["TOPIC","By topic"]];
let setSel = "A", run = [], i = 0, answers = [];
const topics = [...new Set(Q.map(q => q.topic))];
$("topic").innerHTML = topics.map(t => `<option>${t}</option>`).join("");
function renderSets(){
  $("sets").innerHTML = SETS.map(([k,l]) => `<button class="pill" aria-pressed="${k===setSel}" data-k="${k}">${l}</button>`).join("");
  $("topicWrap").classList.toggle("hidden", setSel !== "TOPIC");
  $("count").textContent = pick().length + " questions";
}
$("sets").addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return; setSel = b.dataset.k; renderSets(); });
$("topic").addEventListener("change", renderSets);
function shuffle(a){ a = a.slice(); for(let j=a.length-1;j>0;j--){ const k=Math.floor(Math.random()*(j+1)); [a[j],a[k]]=[a[k],a[j]]; } return a; }
function pick(){
  if ("ABCD".includes(setSel) && setSel.length===1) return Q.filter(q => q.form === setSel);
  if (setSel === "R25") return shuffle(Q).slice(0,25);
  if (setSel === "TOPIC") return Q.filter(q => q.topic === $("topic").value);
  return Q.slice();
}
function begin(list){
  run = ($("shufQ").checked ? shuffle(list) : list).map(q => {
    const order = $("shufO").checked ? shuffle([0,1,2,3]) : [0,1,2,3];
    return { ...q, order };
  });
  i = 0; answers = [];
  $("setup").classList.add("hidden"); $("done").classList.add("hidden"); $("quiz").classList.remove("hidden");
  show();
}
$("start").onclick = () => begin(pick());
function show(){
  const q = run[i];
  $("pos").textContent = `Question ${i+1} of ${run.length}`;
  $("tag").textContent = `${q.topic} · Form ${q.form} #${q.n} · textbook ${q.src}`;
  $("prog").style.width = (i / run.length * 100) + "%";
  $("stem").textContent = q.q;
  $("opts").innerHTML = q.order.map((o,j) => `<button class="opt" data-o="${o}"><b>${"ABCD"[j]}</b><span></span></button>`).join("");
  [...$("opts").children].forEach((b,j) => b.querySelector("span").textContent = q.opts[q.order[j]]);
  $("why").classList.add("hidden"); $("next").disabled = true;
  $("next").textContent = i === run.length-1 ? "See results" : "Next";
  const right = answers.filter(a => a.ok).length;
  $("live").textContent = answers.length ? `${right}/${answers.length} correct` : "";
  $("opts").firstElementChild.focus({preventScroll:true});
}
function choose(o){
  const q = run[i]; if (answers.length > i) return;
  const ok = o === q.ans; answers.push({ q, pick:o, ok });
  [...$("opts").children].forEach(b => { b.disabled = true; const v = +b.dataset.o; if (v === q.ans) b.classList.add("ok"); else if (v === o) b.classList.add("bad"); });
  const w = $("why"); w.innerHTML = `<strong>${ok ? "Correct." : "Not quite — correct answer: " + "ABCD"[q.order.indexOf(q.ans)] + "."}</strong>`;
  const p = document.createElement("span"); p.textContent = q.why; w.appendChild(p); w.classList.remove("hidden");
  $("next").disabled = false; $("next").focus({preventScroll:true});
  const right = answers.filter(a => a.ok).length; $("live").textContent = `${right}/${answers.length} correct`;
}
$("opts").addEventListener("click", e => { const b = e.target.closest(".opt"); if (b && !b.disabled) choose(+b.dataset.o); });
$("next").onclick = () => { if (i < run.length-1){ i++; show(); } else finish(); };
$("quit").onclick = () => finish();
document.addEventListener("keydown", e => {
  if ($("quiz").classList.contains("hidden")) return;
  const k = e.key.toUpperCase(); const idx = "1234".indexOf(k) >= 0 ? "1234".indexOf(k) : "ABCD".indexOf(k);
  if (idx >= 0 && k.length === 1 && answers.length === i){ const b = $("opts").children[idx]; if (b) choose(+b.dataset.o); }
  else if (e.key === "Enter" && !$("next").disabled){ e.preventDefault(); $("next").click(); }
});
function finish(){
  $("quiz").classList.add("hidden"); $("done").classList.remove("hidden");
  const n = answers.length, right = answers.filter(a => a.ok).length;
  $("final").textContent = n ? `${right} / ${n}` : "0 answered";
  $("finalSub").textContent = n ? `${Math.round(right/n*100)}% correct` + (n < run.length ? ` (ended early — ${run.length-n} unanswered)` : "") : "";
  const by = {};
  answers.forEach(a => { const t = a.q.topic; by[t] = by[t] || [0,0]; by[t][1]++; if (a.ok) by[t][0]++; });
  $("byTopic").innerHTML = "<tr><th>Topic</th><th class='n'>Correct</th></tr>" + Object.entries(by).sort((x,y)=>x[1][0]/x[1][1]-y[1][0]/y[1][1]).map(([t,[r,c]]) => `<tr><td>${t}</td><td class="n">${r} / ${c}</td></tr>`).join("");
  const missed = answers.filter(a => !a.ok);
  $("missHead").textContent = missed.length ? `Review missed (${missed.length})` : "No misses — nice work.";
  $("missList").innerHTML = "";
  missed.forEach(a => {
    const d = document.createElement("div"); d.className = "miss";
    const mk = (cls, txt) => { const s = document.createElement("div"); if (cls) s.className = cls; s.textContent = txt; return s; };
    d.append(mk("", `${a.q.topic} · textbook ${a.q.src}: ${a.q.q}`), mk("y", "Your answer: " + a.q.opts[a.pick]), mk("a", "Correct: " + a.q.opts[a.q.ans]), mk("", a.q.why));
    $("missList").appendChild(d);
  });
  $("retry").disabled = !missed.length;
  $("retry").onclick = () => begin(missed.map(a => { const { order, ...rest } = a.q; return rest; }));
  const h = store.get("statsQuizHistory") || []; if (n){ h.unshift({ d: new Date().toLocaleString(), set: setSel, r: right, n }); store.set("statsQuizHistory", h.slice(0,8)); }
}
$("again").onclick = () => { $("done").classList.add("hidden"); $("setup").classList.remove("hidden"); renderHist(); renderSets(); };
function renderHist(){ const h = store.get("statsQuizHistory") || []; $("hist").textContent = h.length ? "Recent: " + h.slice(0,4).map(x => `${x.r}/${x.n}`).join(" · ") : ""; }
renderSets(); renderHist();
</script>
</body>
</html>
